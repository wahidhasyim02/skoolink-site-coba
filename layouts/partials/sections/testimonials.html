<section class="section-testimonial" id="section-testimonial">
  <div class="rounded-[30px] bg-ColorCaribbeanGreen lg:rounded-[50px]">
    <div class="section-space">
      <div class="container-default">
        <!-- Judul & Deskripsi -->
        {{ with site.GetPage "testimonials" }}
        <div class="jos mb-[60px] xl:mb-20">
          <div class="max-w-[746px]">
            <div class="mb-5">
              <h2
                class="font-Kanit text-4xl font-medium leading-none -tracking-[1px] text-ColorMidnightMoss lg:text-5xl xl:text-7xl xxl:text-[80px]">
                {{ .Title }}
              </h2>
            </div>
          </div>
        </div>

        <!-- Slider -->
        <div class="jos">
          <div class="testimonial-one">
            <div class="swiper-wrapper items-stretch">

              {{ range .Params.testimonials }}

              <div class="swiper-slide h-auto flex">

                <div
                  class="flex w-full h-full flex-col rounded-[10px] bg-white p-8 shadow-[0_4px_20px_rgba(0,0,0,0.1)]">

                  <!-- Rating (Bintang 5) -->
                  <div class="mb-6 flex gap-1 text-ColorCorn">
                    <i class="fa-solid fa-star text-sm"></i>
                    <i class="fa-solid fa-star text-sm"></i>
                    <i class="fa-solid fa-star text-sm"></i>
                    <i class="fa-solid fa-star text-sm"></i>
                    <i class="fa-solid fa-star text-sm"></i>
                  </div>

                  <!-- Quote -->
                  <blockquote
                    class="line-clamp-8 text-xl font-semibold -tracking-[1px] text-ColorMidnightMoss lg:text-2xl xl:text-3xl">
                    {{ .quote }}
                  </blockquote>

                  <!-- Nama -->
                  <div class="mt-auto pt-6 text-ColorMidnightMoss">
                    <span class="block text-xl font-semibold">
                      {{ .name }}
                    </span>
                    {{ with .role }}
                    <span class="block text-sm opacity-60 mt-1">
                      {{ . }}
                    </span>
                    {{ end }}
                  </div>

                </div>

              </div>

              {{ end }}

            </div>
          </div>

          <!-- Navigasi -->
          <div
            class="relative z-10 mt-[50px] flex flex-row-reverse justify-center gap-6 lg:-mt-[50px] lg:justify-start">
            <div
              class="slider-nav-btn-next flex h-[50px] w-[50px] items-center justify-center rounded-[50%] border border-ColorMidnightMoss bg-transparent text-ColorMidnightMoss transition-all duration-300 hover:bg-ColorMidnightMoss hover:text-ColorCaribbeanGreen cursor-pointer">
              <i class="fa-solid fa-chevron-right"></i>
            </div>
            <div
              class="slider-nav-btn-prev flex h-[50px] w-[50px] items-center justify-center rounded-[50%] border border-ColorMidnightMoss bg-transparent text-ColorMidnightMoss transition-all duration-300 hover:bg-ColorMidnightMoss hover:text-ColorCaribbeanGreen cursor-pointer">
              <i class="fa-solid fa-chevron-left"></i>
            </div>
          </div>
        </div>
        {{ end }}
      </div>
    </div>
  </div>
</section>
