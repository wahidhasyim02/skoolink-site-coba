name: Deploy Hugo site 

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  HUGO_ENV: production
  HUGO_VERSION: "0.124.1"
  NODE_VERSION: "20.0.0"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Hugo
        run: |
          curl -LO "https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/hugo_extended_${{ env.HUGO_VERSION }}_Linux-64bit.tar.gz"
          tar -xvf hugo_extended_${{ env.HUGO_VERSION }}_Linux-64bit.tar.gz
          sudo mv hugo /usr/local/bin/
          rm hugo_extended_${{ env.HUGO_VERSION }}_Linux-64bit.tar.gz
          hugo version

      - name: Install npm dependencies
        run: npm install

      - name: Publish to GitHub Pages
        run: npm run build

      - name: Deploy to Staging server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: "./public/"
          TARGET: ${{ secrets.REMOTE_PATH }}
          SCRIPT_BEFORE: |
            mkdir -p ${{ secrets.REMOTE_PATH }}
          SCRIPT_AFTER: |
            cd ${{ secrets.REMOTE_PATH }}
            tar xf artifact.tar
            ls -al ${{ secrets.REMOTE_PATH }}
